[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 2000

[rpc_endpoints]
base = "https://base-rpc.publicnode.com"

# The 30-day-notice LPLocker, built with the same settings as every deployed locker
[profile.locker]
src = "locker"
test = "test-locker"
script = "script-locker"
out = "out-locker"
cache_path = "cache-locker"
solc_version = "0.8.20"
evm_version = "shanghai"
optimizer = false
libs = ["lib"]
